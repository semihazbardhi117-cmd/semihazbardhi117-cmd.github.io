<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>System — Hunter Workout</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000510;
  --bg2:#010c1f;
  --bg3:#021428;
  --panel:#030e20;
  --border:#0a3060;
  --border2:#0d4080;
  --blue:#00a8ff;
  --blue2:#0066cc;
  --blue3:#004499;
  --glow:#00a8ff44;
  --glow2:#00a8ff88;
  --text:#c8e8ff;
  --text2:#6a9fcc;
  --text3:#2a5f8f;
  --gold:#ffd700;
  --gold2:#ffaa00;
  --red:#ff3344;
  --green:#00ff88;
  --purple:#8855ff;
  --white:#f0f8ff;
}

@keyframes scanline{0%{transform:translateY(-100%);}100%{transform:translateY(100vh);}}
@keyframes flicker{0%,100%{opacity:1;}92%{opacity:1;}93%{opacity:.8;}94%{opacity:1;}97%{opacity:.9;}98%{opacity:1;}}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--glow);}50%{box-shadow:0 0 20px var(--glow2),0 0 40px var(--glow);}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 8px #ffd70044;}50%{box-shadow:0 0 20px #ffd70088,0 0 40px #ffd70044;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:translateX(0);}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes borderPulse{0%,100%{border-color:var(--border);}50%{border-color:var(--blue3);}}
@keyframes levelUp{0%{opacity:0;transform:scale(.5) translateY(20px);}50%{opacity:1;transform:scale(1.2) translateY(-10px);}100%{opacity:0;transform:scale(1) translateY(-40px);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
  animation:flicker 8s infinite;
}

/* Scanline overlay */
body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
  pointer-events:none;
  z-index:999;
}

/* Moving scan line */
body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  opacity:.3;
  animation:scanline 6s linear infinite;
  pointer-events:none;
  z-index:998;
}

/* ── HEADER ── */
#header{
  padding:20px 16px 0;
  background:linear-gradient(180deg,#000c22 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
#header::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 50% -20%,#001833 0%,transparent 70%);
  pointer-events:none;
}
.sys-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--blue3);
  border:1px solid var(--blue2);
  border-radius:3px;
  padding:2px 8px;
  font-family:'Orbitron',monospace;
  font-size:9px;
  color:var(--blue);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:8px;
  animation:pulse 3s ease-in-out infinite;
}
.sys-badge::before{content:'◆';font-size:7px;}
#header h1{
  font-family:'Orbitron',monospace;
  font-size:22px;
  font-weight:900;
  color:var(--white);
  letter-spacing:2px;
  text-shadow:0 0 20px var(--blue2),0 0 40px var(--blue3);
  line-height:1.1;
}
#header h1 span{color:var(--blue);}
.header-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  color:var(--text3);
  letter-spacing:2px;
  margin-bottom:16px;
  margin-top:4px;
}

/* Hunter rank bar */
.rank-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:4px;
  padding:8px 12px;
  margin-bottom:14px;
}
.rank-badge{
  font-family:'Orbitron',monospace;
  font-size:13px;
  font-weight:900;
  color:var(--gold);
  text-shadow:0 0 10px var(--gold2);
  animation:pulseGold 2s ease-in-out infinite;
  letter-spacing:1px;
}
.rank-info{flex:1;}
.rank-name{font-size:13px;font-weight:700;color:var(--text);letter-spacing:1px;}
.rank-exp{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);margin-top:1px;}
.rank-exp-bar-bg{height:3px;background:var(--border);border-radius:99px;margin-top:5px;overflow:hidden;}
.rank-exp-bar{height:100%;background:linear-gradient(90deg,var(--blue3),var(--blue));border-radius:99px;width:35%;transition:width .5s;}

/* Day selector */
#day-selector{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
#day-selector::-webkit-scrollbar{display:none;}
.day-btn{
  flex-shrink:0;min-width:46px;
  padding:7px 8px;
  border-radius:3px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text3);
  font-family:'Orbitron',monospace;
  font-size:9px;font-weight:700;
  text-align:center;cursor:pointer;
  transition:all .2s;
  letter-spacing:.5px;
}
.day-btn .d-icon{font-size:13px;margin-bottom:2px;}
.day-btn.active{
  border-color:var(--blue);
  background:var(--blue3);
  color:var(--blue);
  box-shadow:0 0 12px var(--glow);
}

/* Day banner */
#day-banner{
  display:flex;align-items:center;gap:10px;
  padding:12px 0 14px;
  border-bottom:1px solid var(--border);
  margin-top:4px;
}
.banner-icon-box{
  width:40px;height:40px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  border:1px solid var(--border2);
  background:var(--bg2);
  position:relative;
}
.banner-icon-box::after{
  content:'';position:absolute;inset:0;border-radius:4px;
  background:linear-gradient(135deg,rgba(0,168,255,.1),transparent);
}
#banner-title{
  font-family:'Orbitron',monospace;
  font-size:13px;font-weight:700;
  color:var(--white);letter-spacing:1px;
}
#banner-desc{font-size:12px;color:var(--text2);margin-top:2px;}

/* ── TAB BAR ── */
#tab-bar{
  display:flex;gap:0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  overflow-x:auto;
  scrollbar-width:none;
}
#tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:0 0 auto;
  min-width:64px;
  padding:8px 6px;
  border:none;border-bottom:2px solid transparent;
  background:transparent;
  color:var(--text3);
  font-family:'Orbitron',monospace;
  font-size:8px;font-weight:700;
  letter-spacing:.3px;
  cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.tab-btn .t-icon{display:block;font-size:14px;margin-bottom:2px;}
.tab-btn.active{
  color:var(--blue);
  border-bottom-color:var(--blue);
  background:var(--bg3);
  text-shadow:0 0 8px var(--blue2);
}

/* ── PANELS ── */
.tab-panel{display:none;padding:14px 14px 60px;animation:fadeIn .3s ease;}
.tab-panel.active{display:block;}

/* ── SYSTEM WINDOW ── */
.sys-window{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:4px;
  margin-bottom:12px;
  overflow:hidden;
  position:relative;
  transition:border-color .2s;
}
.sys-window::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--blue2),transparent);
}
.sys-win-title{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:700;
  color:var(--blue);
  letter-spacing:1px;
}
.sys-win-title::before{content:'▶';font-size:8px;color:var(--blue2);}
.sys-win-body{padding:12px;}

/* ── SCHEDULE ── */
.quest-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:4px;
  margin-bottom:10px;
  overflow:hidden;
  cursor:pointer;
  transition:all .2s;
  position:relative;
}
.quest-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--border2);
  transition:background .2s;
}
.quest-card:hover{border-color:var(--blue2);}
.quest-card:hover::before{background:var(--blue);}
.quest-top{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;}
.quest-day-box{
  width:42px;height:42px;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--border2);background:var(--bg2);flex-shrink:0;
}
.quest-day-icon{font-size:16px;}
.quest-day-code{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;color:var(--text3);margin-top:1px;letter-spacing:1px;}
.quest-info{flex:1;}
.quest-name{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--white);letter-spacing:.5px;}
.quest-type{font-size:11px;margin-top:2px;font-weight:600;}
.quest-meta{text-align:right;}
.quest-meta span{display:block;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);}
.quest-muscles{display:flex;border-top:1px solid var(--border);}
.q-muscle{flex:1;padding:7px 4px;text-align:center;}
.q-muscle:not(:last-child){border-right:1px solid var(--border);}
.q-dot{width:7px;height:7px;border-radius:50%;margin:0 auto 3px;}
.q-mname{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text3);}
.q-msets{font-size:9px;color:var(--text3);margin-top:1px;}

/* Progress rules */
.rule-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.rule-item:last-child{border-bottom:none;padding-bottom:0;}
.rule-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
.rule-text{font-size:12px;color:var(--text2);line-height:1.5;}

/* ── WORKOUT ── */
.alert-box{
  border-radius:3px;padding:9px 12px;
  margin-bottom:14px;font-size:12px;
  color:var(--gold);
  background:rgba(255,215,0,.05);
  border:1px solid rgba(255,215,0,.2);
  border-left:3px solid var(--gold);
  font-weight:600;letter-spacing:.3px;
}
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.prog-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:2px;}
.prog-val{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;}
.prog-bg{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:14px;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue3),var(--blue));transition:width .4s;box-shadow:0 0 8px var(--glow);}

.ex-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:4px;
  margin-bottom:12px;
  overflow:hidden;
  position:relative;
  transition:border-color .3s;
}
.ex-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  transition:background .2s;
  background:var(--border2);
}
.ex-card.ex-complete::before{background:var(--green);}
.ex-card.ex-complete{border-color:rgba(0,255,136,.3);}
.ex-header{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;cursor:pointer;}
.ex-color-box{
  width:34px;height:34px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ex-dot-big{width:12px;height:12px;border-radius:50%;}
.ex-name{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--white);letter-spacing:.5px;}
.ex-detail{font-size:11px;color:var(--text3);margin-top:2px;}
.ex-detail span{font-weight:600;}
.ex-right{margin-left:auto;text-align:right;}
.ex-counter{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;}
.ex-rest-info{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text3);margin-top:2px;}

.ex-tip-box{padding:0 12px 10px 14px;}
.ex-tip-inner{
  background:var(--bg2);border-radius:3px;
  padding:8px 10px;
  font-size:11px;color:var(--text2);line-height:1.5;
  border-left:2px solid var(--blue3);
  font-family:'Share Tech Mono',monospace;
}

.sets-grid{
  border-top:1px solid var(--border);
  padding:10px 12px 10px 14px;
  display:flex;gap:7px;flex-wrap:wrap;
}
.set-btn{
  width:50px;height:50px;
  border-radius:3px;
  border:1px solid var(--border2);
  background:var(--bg2);
  color:var(--text3);
  font-family:'Orbitron',monospace;
  font-weight:700;font-size:10px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  cursor:pointer;transition:all .2s;
}
.set-btn:hover{border-color:var(--blue2);color:var(--blue);}
.set-btn.done{color:var(--green);border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.05);}
.set-btn .s-reps{font-size:8px;color:var(--text3);}
.set-btn.done .s-reps{display:none;}

/* Rest timer */
.rest-box{
  border-top:1px solid var(--border);
  padding:14px 12px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--bg2);
}
.rest-title{
  font-family:'Orbitron',monospace;font-size:9px;
  color:var(--blue);letter-spacing:4px;
}
.skip-btn{
  background:none;border:1px solid var(--border2);
  color:var(--text3);border-radius:3px;
  padding:4px 14px;font-size:11px;
  font-family:'Orbitron',monospace;letter-spacing:1px;
  cursor:pointer;transition:all .2s;
}
.skip-btn:hover{border-color:var(--blue2);color:var(--blue);}

/* Complete */
.complete-box{
  border-radius:4px;padding:20px;text-align:center;
  margin-top:8px;
  background:rgba(0,255,136,.04);
  border:1px solid rgba(0,255,136,.2);
  animation:fadeIn .5s ease;
}
.complete-emoji{font-size:40px;}
.complete-title{
  font-family:'Orbitron',monospace;font-size:16px;font-weight:900;
  color:var(--green);margin-top:10px;letter-spacing:2px;
  text-shadow:0 0 20px rgba(0,255,136,.5);
}
.complete-sub{font-size:12px;color:var(--text3);margin-top:4px;font-family:'Share Tech Mono',monospace;}

/* Rest day */
.rest-center{text-align:center;padding:30px 20px 20px;}
.rest-emoji{font-size:60px;}
.rest-day-title{
  font-family:'Orbitron',monospace;font-size:18px;font-weight:900;
  color:var(--white);margin-top:12px;letter-spacing:2px;
}
.rest-day-sub{font-size:12px;color:var(--text3);margin-top:4px;font-family:'Share Tech Mono',monospace;}
.rest-checklist{margin-top:14px;}
.rest-check-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  border:1px solid var(--border);border-radius:3px;
  background:var(--panel);margin-bottom:8px;
}
.rest-check-dot{width:5px;height:5px;border-radius:50%;background:var(--blue3);flex-shrink:0;}
.rest-check-text{font-size:13px;color:var(--text2);font-weight:500;}

/* ── WARMUP ── */
.phase-row{display:flex;gap:8px;margin-bottom:14px;}
.phase-btn{
  flex:1;padding:10px;border-radius:3px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text3);
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  letter-spacing:1px;cursor:pointer;transition:all .2s;
}
.phase-btn.active-warmup{
  background:rgba(255,100,0,.1);border-color:#ff6400;
  color:#ff6400;box-shadow:0 0 10px rgba(255,100,0,.2);
}
.phase-btn.active-cool{
  background:rgba(136,85,255,.1);border-color:var(--purple);
  color:var(--purple);box-shadow:0 0 10px rgba(136,85,255,.2);
}
.wu-stats{
  display:flex;justify-content:space-between;margin-bottom:12px;
  font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);
}
.wu-item{
  background:var(--panel);border-radius:3px;padding:12px;
  margin-bottom:9px;border:1px solid var(--border);
  transition:all .2s;
}
.wu-item.wu-done{opacity:.6;}
.wu-row{display:flex;align-items:center;gap:10px;}
.wu-info{flex:1;}
.wu-name{font-weight:700;font-size:13px;letter-spacing:.3px;}
.wu-desc{font-size:11px;color:var(--text3);margin-top:2px;font-family:'Share Tech Mono',monospace;}
.wu-img-wrap{
  width:100%;overflow:hidden;border-radius:4px 4px 0 0;
  border-bottom:1px solid var(--border);
  background:#000c1a;
  display:flex;align-items:center;justify-content:center;
  max-height:160px;
}
.wu-img{
  width:100%;max-height:160px;object-fit:contain;
  filter:brightness(.9) contrast(1.05);
  display:block;
}
.wu-start-btn{
  border-radius:3px;padding:8px 14px;
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  border:none;white-space:nowrap;cursor:pointer;letter-spacing:.5px;
  transition:all .2s;
}

/* ── NUTRITION ── */
.nutr-hint{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:14px;line-height:1.6;}
.nutr-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:4px;margin-bottom:9px;
  overflow:hidden;cursor:pointer;transition:all .2s;
  position:relative;
}
.nutr-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--border2);transition:background .2s;
}
.nutr-top{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;}
.nutr-icon{
  width:38px;height:38px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  background:var(--bg2);border:1px solid var(--border2);
}
.nutr-title{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--white);letter-spacing:.5px;flex:1;}
.nutr-arrow{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text3);}
.nutr-body{padding:0 12px 12px 14px;display:none;}
.nutr-body.open{display:block;animation:fadeIn .2s ease;}
.nutr-tip-text{
  background:var(--bg2);border-radius:3px;
  padding:10px 12px;font-size:12px;
  color:var(--text2);line-height:1.7;
  font-family:'Share Tech Mono',monospace;
}

/* ── SVG TIMER ── */
svg.timer-svg{display:block;}

/* ── NOTIFICATION POPUP ── */
#notif{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--blue);
  border-radius:4px;padding:10px 20px;
  font-family:'Orbitron',monospace;font-size:11px;
  color:var(--blue);letter-spacing:1px;
  box-shadow:0 0 20px var(--glow);
  z-index:9999;display:none;
  text-align:center;white-space:nowrap;
}
#notif.show{display:block;animation:fadeIn .3s ease;}

/* Divider */
.sys-divider{
  display:flex;align-items:center;gap:8px;
  margin:16px 0 12px;
}
.sys-divider span{
  font-family:'Orbitron',monospace;font-size:9px;
  color:var(--text3);letter-spacing:3px;white-space:nowrap;
}
.sys-divider::before,.sys-divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--border));
}
.sys-divider::after{background:linear-gradient(90deg,var(--border),transparent);}

/* ── CALENDAR ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--white);letter-spacing:2px;}
.cal-nav{background:var(--panel);border:1px solid var(--border);color:var(--blue);
  font-family:'Orbitron',monospace;font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all .2s;}
.cal-nav:hover{border-color:var(--blue);box-shadow:0 0 8px var(--glow);}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
.cal-day-label{font-family:'Orbitron',monospace;font-size:8px;color:var(--text3);text-align:center;padding:4px 0;letter-spacing:1px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{
  aspect-ratio:1;border-radius:3px;border:1px solid var(--border);
  background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;
  font-family:'Orbitron',monospace;font-size:10px;color:var(--text3);
}
.cal-cell:hover{border-color:var(--blue2);}
.cal-cell.today{border-color:var(--blue);color:var(--blue);box-shadow:0 0 6px var(--glow);}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-cell.logged{color:var(--white);}
.cal-cell .cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px;}
.cal-cell .cal-type{font-size:6px;letter-spacing:.5px;margin-top:1px;text-align:center;line-height:1;}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-box{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px 8px;text-align:center;}
.stat-val{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--blue);}
.stat-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text3);margin-top:3px;letter-spacing:1px;}

/* Level card */
.level-card{
  background:linear-gradient(135deg,#000c22,#010e28);
  border:1px solid var(--blue2);border-radius:6px;padding:16px;
  margin-bottom:14px;position:relative;overflow:hidden;
}
.level-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
}
.level-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(0,100,200,.08),transparent 60%);
  pointer-events:none;
}
.rank-title{font-family:'Orbitron',monospace;font-size:10px;color:var(--text3);letter-spacing:3px;margin-bottom:4px;}
.rank-display{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.rank-gem{
  width:50px;height:50px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  border:1px solid var(--border2);
  background:var(--bg2);
}
.rank-big{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;letter-spacing:1px;}
.rank-sub{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text3);margin-top:2px;}
.exp-section{}
.exp-label-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.exp-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;}
.exp-val{font-family:'Orbitron',monospace;font-size:10px;color:var(--blue);font-weight:700;}
.exp-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.exp-prog{height:100%;border-radius:99px;transition:width .6s;
  background:linear-gradient(90deg,var(--blue3),var(--blue));
  box-shadow:0 0 10px var(--glow);}

/* Log modal */
.log-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:9000;animation:fadeIn .2s ease;
}
.log-sheet{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:12px 12px 0 0;padding:20px 16px 32px;
  width:100%;max-width:480px;
}
.log-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;
  color:var(--white);letter-spacing:1px;margin-bottom:4px;}
.log-date{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:14px;}
.log-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.log-type-btn{
  padding:12px 8px;border-radius:4px;border:1px solid var(--border);
  background:var(--panel);color:var(--text2);
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  cursor:pointer;transition:all .2s;text-align:center;letter-spacing:.5px;
}
.log-type-btn:hover{border-color:var(--blue2);}
.log-type-btn.selected{border-color:var(--blue);background:var(--blue3);color:var(--white);box-shadow:0 0 10px var(--glow);}
.log-actions{display:flex;gap:8px;}
.log-confirm{flex:1;padding:11px;border-radius:4px;border:none;
  background:var(--blue);color:#000;font-family:'Orbitron',monospace;
  font-size:11px;font-weight:900;cursor:pointer;letter-spacing:1px;}
.log-cancel{padding:11px 16px;border-radius:4px;border:1px solid var(--border);
  background:none;color:var(--text3);font-family:'Orbitron',monospace;
  font-size:11px;cursor:pointer;}
.log-exp-preview{
  background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:8px 12px;margin-bottom:12px;
  font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--green);
  text-align:center;letter-spacing:1px;
}

/* Streak */
.streak-card{
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px;
}
.streak-fire{font-size:28px;}
.streak-val{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--gold);}
.streak-lbl{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);margin-top:2px;}

/* Level up popup */
.levelup-popup{
  position:fixed;inset:0;background:rgba(0,5,16,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;animation:fadeIn .3s ease;
}
.levelup-box{
  background:var(--bg2);border:2px solid var(--blue);border-radius:8px;
  padding:32px 24px;text-align:center;max-width:300px;width:90%;
  box-shadow:0 0 60px var(--glow2),0 0 120px var(--glow);
}
.levelup-icon{font-size:56px;}
.levelup-title{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;
  color:var(--blue);margin-top:12px;letter-spacing:2px;
  text-shadow:0 0 20px var(--blue2);}
.levelup-rank{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;
  margin-top:6px;letter-spacing:1px;}
.levelup-sub{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text3);margin-top:8px;}
.levelup-close{
  margin-top:20px;padding:10px 32px;border-radius:4px;
  border:1px solid var(--blue);background:none;
  color:var(--blue);font-family:'Orbitron',monospace;font-size:11px;
  cursor:pointer;letter-spacing:1px;
}

/* Log workout button */
.log-workout-btn{
  width:100%;padding:13px;border-radius:4px;border:none;
  background:linear-gradient(90deg,var(--blue3),var(--blue2));
  color:var(--white);font-family:'Orbitron',monospace;font-size:12px;
  font-weight:900;cursor:pointer;letter-spacing:2px;
  box-shadow:0 0 20px var(--glow);transition:all .2s;
  margin-top:12px;display:block;
}
.log-workout-btn:hover{box-shadow:0 0 30px var(--glow2);}

</style>
</head>

  const r=size/2-7,circ=2*Math.PI*r,progress=total>0?sec/total:0,dash=circ*progress;
  return `<svg class="timer-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#021428" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray .4s"/>
    <text x="${size/2}" y="${size/2+5}" text-anchor="middle" fill="${color}" font-size="${Math.floor(size/4)}" font-weight="bold" font-family="'Orbitron',monospace">${sec}</text>
  </svg>`;
}

function clearRest(){

}
function toggleSet(ei,si,dur,color,reps){
  const key=`${currentDay}-${ei}-${si}`;
  setLog[key]=!setLog[key];
  if(setLog[key]){
    clearRest();
    activeRestEi=ei;restDuration=dur;restColor=color;restSec=dur;
    startRestTimer(ei,dur,color);
    notify(`// SET ${si+1} COMPLETE — REST ${dur}S`);
  } else {
    if(activeRestEi===ei){clearRest();const rb=document.getElementById('rest-'+ei);if(rb)rb.style.display='none';}
  }
  const btn=document.getElementById(`sb-${ei}-${si}`);
  if(btn){
    const done=setLog[key];
    btn.className='set-btn'+(done?' done':'');
    btn.innerHTML=done?'<span>✓</span>':`<span>S${si+1}</span><span class="s-reps">${reps}</span>`;
  }
  updateProgress();
}
function startRestTimer(ei,dur,color){
  const rb=document.getElementById('rest-'+ei);
  if(!rb)return;
  rb.style.display='block';
  restSec=dur;
  function draw(){rb.innerHTML=`<div class="rest-box">${makeTimerSVG(restSec,dur,color,72)}<div class="rest-title">// REST PERIOD</div><button class="skip-btn" onclick="skipRest(${ei})">SKIP ▶</button></div>`;}
  draw();
  restInterval=setInterval(()=>{
    restSec--;
    if(restSec<=0){clearRest();if(rb){rb.style.display='none';rb.innerHTML='';}notify('// REST COMPLETE — RESUME TRAINING');return;}
    draw();
  },1000);
}

  const d=DAYS[currentDay];if(d.rest)return;

const RANKS=[
  {name:'E-RANK',  gem:'🔘',color:'#9ca3af',expNeeded:0,    nextExp:500},
  {name:'D-RANK',  gem:'🔵',color:'#3b82f6',expNeeded:500,  nextExp:1500},

  {name:'S-RANK',  gem:'🔴',color:'#ef4444',expNeeded:12000,nextExp:25000},
  {name:'NATIONAL',gem:'🟣',color:'#a855f7',expNeeded:25000,nextExp:50000},
  {name:'SHADOW MONARCH',gem:'👑',color:'#ffd700',expNeeded:50000,nextExp:100000},
];
const QUEST_EXP={'S-RANK QUEST':300,'A-RANK QUEST':200,'B-RANK QUEST':100,'REST':30};
const QUEST_COLORS={'S-RANK QUEST':'#ef4444','A-RANK QUEST':'#f59e0b','B-RANK QUEST':'#a855f7','REST':'#6b7280'};
const QUEST_SHORT={'S-RANK QUEST':'S','A-RANK QUEST':'A','B-RANK QUEST':'B','REST':'R'};
const MONTHS_FULL=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const MONTHS_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_S=['SUN','MON','TUE','WED','THU','FRI','SAT'];

let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();
let selectedLogDate=null;
let selectedLogType=null;

function getLog(){return loadData('calendar',{});}
function saveLog(log){saveData('calendar',log);}

function getTotalExp(){
  const log=getLog();
  return Object.values(log).reduce((t,e)=>t+(QUEST_EXP[e.questType]||0),0);
}
function getRank(exp){
  let r=RANKS[0];
  for(let i=RANKS.length-1;i>=0;i--){if(exp>=RANKS[i].expNeeded){r=RANKS[i];break;}}
  return r;
}
function getNextRank(exp){
  for(let i=0;i<RANKS.length-1;i++){if(exp<RANKS[i+1].expNeeded)return RANKS[i+1];}
  return null;
}
function calcStreak(){
  const log=getLog();
  let streak=0,d=new Date();
  while(true){
    const k=dateKey(d);
    if(log[k]){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}
function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){return dateKey(new Date());}

function updateRankBar(){
  const exp=getTotalExp();
  const rank=getRank(exp);
  const next=getNextRank(exp);
  const inRank=exp-rank.expNeeded;
  const needed=next?next.expNeeded-rank.expNeeded:1;
  const pct=Math.min(100,Math.round((inRank/needed)*100));
  const rb=document.querySelector('.rank-badge');
  if(rb){rb.textContent=rank.name;rb.style.color=rank.color;rb.style.textShadow='0 0 10px '+rank.color;}
  const re=document.querySelector('.rank-exp');
  if(re)re.textContent='EXP: '+exp.toLocaleString()+' / '+(next?next.expNeeded.toLocaleString():'MAX')+' ('+pct+'%)';
  const rf=document.querySelector('.rank-exp-bar');
  if(rf)rf.style.width=pct+'%';
}

function showLevelUp(rank){
  const div=document.createElement('div');
  div.className='levelup-popup';
  div.innerHTML='<div class="levelup-box">'+
    '<div class="levelup-icon">'+rank.gem+'</div>'+
    '<div class="levelup-title">RANK UP!</div>'+
    '<div class="levelup-rank" style="color:'+rank.color+'">'+rank.name+'</div>'+
    '<div class="levelup-sub">// YOUR POWER HAS SURPASSED ITS LIMITS<br>// NEW ABILITIES UNLOCKED</div>'+
    '<button class="levelup-close" style="border-color:'+rank.color+';color:'+rank.color+'" onclick="this.closest(\'.levelup-popup\').remove()">CONTINUE</button>'+
  '</div>';
  document.body.appendChild(div);
  notify('RANK UP — '+rank.name+'!');
}

function logEntry(dateKey,questType){
  const log=getLog();
  const expBefore=getTotalExp();
  const rankBefore=getRank(expBefore);
  log[dateKey]={questType,loggedAt:new Date().toISOString()};
  saveLog(log);
  const expAfter=getTotalExp();
  const rankAfter=getRank(expAfter);
  if(rankBefore.name!==rankAfter.name){setTimeout(()=>showLevelUp(rankAfter),400);}
  updateRankBar();
  notify('// +'+QUEST_EXP[questType]+' EXP GAINED');
}

function prevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function nextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}

function renderCalendar(){
  const el=document.getElementById('tab-calendar');
  if(!el)return;
  const log=getLog();
  const exp=getTotalExp();
  const rank=getRank(exp);
  const next=getNextRank(exp);
  const inRank=exp-rank.expNeeded;
  const needed=next?next.expNeeded-rank.expNeeded:1;
  const pct=Math.min(100,Math.round((inRank/needed)*100));
  const streak=calcStreak();
  const total=Object.keys(log).length;
  const monthTotal=Object.keys(log).filter(k=>{const[y,m]=k.split('-').map(Number);return y===calYear&&m===calMonth+1;}).length;

  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const tKey=todayKey();

  let cells='';
  for(let i=0;i<firstDay;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const k=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const entry=log[k];
    const isToday=k===tKey;
    const isFuture=new Date(calYear,calMonth,d)>today;
    const col=entry?QUEST_COLORS[entry.questType]:'';
    cells+='<div class="cal-cell'+(entry?' logged':'')+(isToday?' today':'')+'"'+
      (col?' style="background:'+col+'18;border-color:'+col+'55"':'')+
      (isFuture?' style="opacity:.35;cursor:default"':!isFuture?' onclick="openLogModal(\''+k+'\','+calYear+','+(calMonth+1)+','+d+')"':'')+'>'+
      '<span>'+d+'</span>'+
      (entry?'<div class="cal-dot" style="background:'+col+'"></div><div class="cal-type" style="color:'+col+'">'+QUEST_SHORT[entry.questType]+'</div>':'')+
    '</div>';
  }

  el.innerHTML=
  '<div class="level-card">'+
    '<div class="rank-title">// HUNTER STATUS</div>'+
    '<div class="rank-display">'+
      '<div class="rank-gem">'+rank.gem+'</div>'+
      '<div>'+
        '<div class="rank-big" style="color:'+rank.color+'">'+rank.name+'</div>'+
        '<div class="rank-sub">TOTAL EXP: '+exp.toLocaleString()+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="exp-label-row"><span class="exp-label">// PROGRESS TO '+( next?next.name:'MAX')+'</span><span class="exp-val">'+inRank.toLocaleString()+' / '+needed.toLocaleString()+'</span></div>'+
    '<div class="exp-track"><div class="exp-prog" style="width:'+pct+'%;background:linear-gradient(90deg,'+rank.color+'88,'+rank.color+')"></div></div>'+
  '</div>'+

  '<div class="stats-row">'+
    '<div class="stat-box"><div class="stat-val" style="color:#ffd700">'+streak+'</div><div class="stat-lbl">DAY STREAK</div></div>'+
    '<div class="stat-box"><div class="stat-val">'+total+'</div><div class="stat-lbl">TOTAL QUESTS</div></div>'+
    '<div class="stat-box"><div class="stat-val" style="color:#a855f7">'+monthTotal+'</div><div class="stat-lbl">THIS MONTH</div></div>'+
  '</div>'+

  '<div class="sys-window">'+
    '<div class="sys-win-title" style="display:flex;justify-content:space-between;align-items:center">'+
      '<span>// '+MONTHS_FULL[calMonth]+' '+calYear+'</span>'+
      '<div style="display:flex;gap:6px">'+
        '<button class="cal-nav" onclick="prevMonth()">&#9664;</button>'+
        '<button class="cal-nav" onclick="nextMonth()">&#9654;</button>'+
      '</div>'+
    '</div>'+
    '<div class="sys-win-body" style="padding:10px">'+
      '<div class="cal-grid-header">'+DAYS_S.map(d=>'<div class="cal-day-label">'+d+'</div>').join('')+'</div>'+
      '<div class="cal-grid">'+cells+'</div>'+
    '</div>'+
  '</div>'+

  '<div class="sys-window">'+
    '<div class="sys-win-title">// QUEST LEGEND</div>'+
    '<div class="sys-win-body" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      Object.entries(QUEST_COLORS).map(([type,col])=>
        '<div style="display:flex;align-items:center;gap:8px">'+
          '<div style="width:10px;height:10px;border-radius:50%;background:'+col+';box-shadow:0 0 6px '+col+'88;flex-shrink:0"></div>'+
          '<div>'+
            '<div style="font-family:Orbitron,monospace;font-size:9px;color:#c8e8ff">'+type+'</div>'+
            '<div style="font-family:\'Share Tech Mono\',monospace;font-size:10px;color:#00ff88;margin-top:1px">+'+QUEST_EXP[type]+' EXP</div>'+
          '</div>'+
        '</div>'
      ).join('')+
    '</div>'+
  '</div>'+

  '<div class="sys-window">'+
    '<div class="sys-win-title">// RANK PROGRESSION</div>'+
    '<div class="sys-win-body">'+
      RANKS.map(r=>{
        const isCurrent=r.name===rank.name;
        return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">'+
          '<span style="font-size:16px">'+r.gem+'</span>'+
          '<div style="flex:1">'+
            '<div style="font-family:Orbitron,monospace;font-size:10px;font-weight:700;color:'+(isCurrent?r.color:'#6b7280')+'">'+r.name+(isCurrent?' ← YOU':' ')+'</div>'+
            '<div style="font-family:\'Share Tech Mono\',monospace;font-size:9px;color:#2a5f8f">'+r.expNeeded.toLocaleString()+' EXP required</div>'+
          '</div>'+
          (isCurrent?'<div style="font-family:Orbitron,monospace;font-size:9px;color:'+r.color+';border:1px solid '+r.color+';padding:2px 6px;border-radius:2px">CURRENT</div>':'')+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}

function openLogModal(key,y,m,d){
  selectedLogDate=key;
  selectedLogType=null;
  const existing=getLog()[key];
  const div=document.createElement('div');
  div.className='log-modal';
  div.id='log-modal';
  div.innerHTML=
  '<div class="log-sheet">'+
    '<div class="log-title">// LOG QUEST</div>'+
    '<div class="log-date">'+MONTHS_S[m-1]+' '+d+', '+y+(existing?' &bull; EDIT ENTRY':'')+'</div>'+
    '<div class="log-types">'+
      [['S-RANK QUEST','⚡','#ef4444','FULL / HARD DAY'],['A-RANK QUEST','🔥','#f59e0b','MEDIUM DAY'],['B-RANK QUEST','🌤️','#a855f7','LIGHT DAY'],['REST','😴','#6b7280','REST DAY']].map(([type,icon,col,sub])=>
        '<button class="log-type-btn'+(existing&&existing.questType===type?' selected':'')+'" onclick="selectLogType(\''+type+'\',this)" style="border-color:'+col+'44">'+
          '<div style="font-size:20px;margin-bottom:4px">'+icon+'</div>'+
          '<div style="color:'+col+'">'+type.split(' ')[0]+'</div>'+
          '<div style="font-size:9px;color:#6b7280;margin-top:2px">'+sub+'</div>'+
          '<div style="font-size:9px;color:#00ff88;font-family:Orbitron,monospace;margin-top:3px">+'+QUEST_EXP[type]+' EXP</div>'+
        '</button>'
      ).join('')+
    '</div>'+
    '<div class="log-exp-preview" id="exp-preview" style="display:none"></div>'+
    '<div class="log-actions">'+
      '<button class="log-cancel" onclick="closeLogModal()">CANCEL</button>'+
      '<button class="log-confirm" id="log-confirm-btn" onclick="confirmLog()" style="opacity:.4;pointer-events:none">LOG QUEST</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(div);
  if(existing)selectLogType(existing.questType,div.querySelector('.log-type-btn.selected'));
}

function selectLogType(type,btn){
  selectedLogType=type;
  document.querySelectorAll('.log-type-btn').forEach(b=>b.classList.remove('selected'));
  if(btn)btn.classList.add('selected');
  const pr=document.getElementById('exp-preview');
  if(pr){pr.style.display='block';pr.textContent='// +'+QUEST_EXP[type]+' EXP WILL BE ADDED TO YOUR PROFILE';}
  const cf=document.getElementById('log-confirm-btn');
  if(cf){cf.style.opacity='1';cf.style.pointerEvents='auto';}
}

function closeLogModal(){const m=document.getElementById('log-modal');if(m)m.remove();}

function confirmLog(){
  if(!selectedLogType||!selectedLogDate)return;
  logEntry(selectedLogDate,selectedLogType);
  closeLogModal();
  if(currentTab==='calendar')renderCalendar();
}

function showLogButton(dayData){
  const existing=document.querySelector('.log-workout-btn');
  if(existing)return;
  const el=document.getElementById('tab-workout');
  const btn=document.createElement('button');
  btn.className='log-workout-btn';
  btn.textContent='⚔️ LOG QUEST TO CALENDAR';
  btn.onclick=()=>{
    openLogModal(todayKey(),new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());
    setTimeout(()=>{
      const btns=document.querySelectorAll('.log-type-btn');
      btns.forEach(b=>{
        if((dayData.questType==='S-RANK QUEST'&&b.textContent.includes('S-RANK'))||
           (dayData.questType==='A-RANK QUEST'&&b.textContent.includes('A-RANK'))||
           (dayData.questType==='B-RANK QUEST'&&b.textContent.includes('B-RANK')))
          selectLogType(dayData.questType,b);
      });
    },100);
  };
  el.appendChild(btn);
}

// BOOT
renderDaySelector();
renderBanner();
renderSchedule();
updateRankBar();

// Boot notification
setTimeout(()=>notify('// SYSTEM ONLINE — WELCOME BACK, HUNTER'),500);
</script>
</body>
